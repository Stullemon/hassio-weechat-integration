# WeeChat Monitor Services

register_download:
  name: Register Download
  description: Register a completed DCC download from WeeChat
  fields:
    filename:
      name: Filename
      description: Name of the downloaded file
      required: true
      example: "video.mkv"
      selector:
        text:
    size_bytes:
      name: Size (bytes)
      description: Size of the file in bytes
      required: true
      example: 1073741824
      selector:
        number:
          min: 0
          max: 10995116277760
          mode: box
    timestamp:
      name: Timestamp
      description: Unix timestamp of the download completion
      required: false
      example: 1234567890
      selector:
        number:
          min: 0
          mode: box
    filename_suffix:
      name: Filename Suffix
      description: Suffix appended to the filename in case of duplicate downloads (e.g., for "file.txt.1", the suffix is 1)
      required: false
      example: 1
      selector:
        number:
          min: -1
          max: 10995116277760
          mode: box

update_counts:
  name: Update Counts
  description: Update aggregated counters (servers, channels, private chats)
  fields:
    total_servers:
      name: Total servers
      description: Total number of known servers (integer)
      required: false
      example: 4
      selector:
        number:
          min: 0
          mode: box
    connected_servers:
      name: Connected servers
      description: Number of currently connected servers (integer)
      required: false
      example: 2
      selector:
        number:
          min: 0
          mode: box
    total_channels:
      name: Total channels
      description: Total number of channels across servers (integer)
      required: false
      example: 37
      selector:
        number:
          min: 0
          mode: box
    total_private_chats:
      name: Total private chats
      description: Total private chats (integer)
      required: false
      example: 15
      selector:
        number:
          min: 0
          mode: box
    alive:
      name: Addon alive
      description: Whether the WeeChat add-on is alive (boolean). Set True while running, False when shutting down.
      required: false
      selector:
        boolean: {}
